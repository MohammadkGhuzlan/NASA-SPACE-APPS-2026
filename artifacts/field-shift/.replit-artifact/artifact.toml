kind = "web"
previewPath = "/"
title = "Field Shift"
description = "Agricultural intelligence and crop rotation planning with global farm mapping and transparent environmental data."
version = "1.0.0"
id = "artifacts/field-shift"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22068

[services.development]
run = "pnpm --filter @workspace/field-shift run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/field-shift", "run", "build" ]
serve = "static"
publicDir = "artifacts/field-shift/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22068"
BASE_PATH = "/"
