openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Field Shift farm intelligence foundation
servers:
  - url: /api
paths:
  /farms/{id}/experimental-ml:
    get:
      operationId: getExperimentalStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Owner-scoped development authorization and verified experimental model metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperimentalStatus" }
    post:
      operationId: runExperimentalPrediction
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExperimentalPredictionInput" }
      responses:
        "200":
          description: Bounded research job or cached actual experimental output; never used by planner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperimentalJob" }
  /farms/{id}/experimental-ml/jobs/{jobId}:
    get:
      operationId: getExperimentalJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Authorized owner-only research job progress and result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperimentalJob" }
  /gaez/catalog:
    get:
      operationId: getGaezCatalog
      responses:
        "200":
          description: Verified published FAO class definitions and locally acquired subset; never downloads on request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GaezCatalog" }
  /farms/{id}/gaez:
    post:
      operationId: assessFarmGaez
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GaezAssessmentInput" }
      responses:
        "200":
          description: Owner-scoped exact farm-coordinate categorical raster extraction, including honest unavailable states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GaezAssessment" }
        "404": { description: Farm not found in this browser workspace }
  /analysis/model-status:
    get:
      operationId: getAnalysisModelStatus
      responses:
        "200":
          description: Stage A readiness only; never loads a model or exposes artifact paths
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisModelStatus" }
  /knowledge:
    get:
      operationId: getAgriculturalKnowledge
      responses:
        "200":
          description: Curated reference facts, limitations and version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgriculturalKnowledge" }
  /farms/{id}/plans:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listFarmingPlans
      responses:
        "200":
          description: Owner-scoped saved report summaries
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FarmingPlanSummary" } }
    post:
      operationId: generateFarmingPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FarmingPlanInput" }
      responses:
        "201":
          description: Persisted reference-based report; no trained predictions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarmingPlanReport" }
        "422": { description: Invalid planning inputs }
  /farms/{id}/plans/{planId}:
    get:
      operationId: getFarmingPlan
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: planId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Immutable saved report snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarmingPlanReport" }
  /environment/summary:
    get:
      operationId: getEnvironmentalSummary
      parameters:
        - { $ref: "#/components/parameters/Latitude" }
        - { $ref: "#/components/parameters/Longitude" }
        - { name: hot_threshold, in: query, schema: { type: number, default: 35 } }
        - { name: dry_threshold, in: query, schema: { type: number, default: 1 } }
      responses:
        "200":
          description: Calendar-complete daily-derived climate and wetness statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentalSummary" }
  /environment/history:
    get:
      operationId: getEnvironmentalHistory
      parameters:
        - { $ref: "#/components/parameters/Latitude" }
        - { $ref: "#/components/parameters/Longitude" }
        - { name: year, in: query, schema: { type: integer, default: 2025 } }
      responses:
        "200":
          description: Unsampled daily history for the requested year
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentalHistory" }
  /environment/soil-properties:
    get:
      operationId: getSoilProperties
      parameters:
        - { $ref: "#/components/parameters/Latitude" }
        - { $ref: "#/components/parameters/Longitude" }
      responses:
        "200":
          description: Exact-reference proxy only, never field ground truth
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoilProperties" }
  /environment/soil-wetness:
    get:
      operationId: getSoilWetness
      parameters:
        - { $ref: "#/components/parameters/Latitude" }
        - { $ref: "#/components/parameters/Longitude" }
      responses:
        "200":
          description: Modeled wetness fraction, not SMAP
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WetnessHistory" }
  /environment/compare:
    get:
      operationId: compareRegions
      responses:
        "200":
          description: Four stored reference locations without live API substitution
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RegionalComparison" } }
  /data/status:
    get:
      operationId: getDataStatus
      responses:
        "200":
          description: Import audit reports and stored value counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataStatus" }
  /data/import:
    post:
      operationId: importEnvironmentalData
      responses:
        "200":
          description: Fixed dataset bundle import, operator allowlist required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRecord" }
        "403": { description: Public sessions may not import data }
  /farms/{id}/measurements:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listMeasurements
      responses:
        "200":
          description: Separate farmer-reported measurements
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FarmerMeasurement" } }
    post:
      operationId: saveMeasurement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeasurementInput" }
      responses:
        "201":
          description: Saved with original depth, units and self-reported source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarmerMeasurement" }
  /farms/{id}/features:
    get:
      operationId: getFarmFeatures
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Input features with provenance, no labels or trained model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRecord" }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /farms:
    get:
      operationId: listFarms
      responses:
        "200":
          description: Saved farms
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Farm" } }
    post:
      operationId: createFarm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FarmInput" }
      responses:
        "201":
          description: Saved farm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
  /farms/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getFarm
      responses:
        "200":
          description: Farm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
    put:
      operationId: updateFarm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FarmInput" }
      responses:
        "200":
          description: Updated farm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
  /case-studies:
    get:
      operationId: listCaseStudies
      responses:
        "200":
          description: Geographic starting points, not measured farms
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CaseStudy" } }
  /geocode:
    get:
      operationId: searchLocations
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        "200":
          description: Global search results
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CaseStudy" } }
  /farms/{id}/environment:
    get:
      operationId: getEnvironment
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Available measurements and explicit limitations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
  /farms/{id}/strategies:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listStrategies
      responses:
        "200":
          description: Farmer draft strategies
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Strategy" } }
    post:
      operationId: saveStrategy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StrategyInput" }
      responses:
        "201":
          description: Saved unassessed strategy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Strategy" }
  /sources:
    get:
      operationId: listSources
      responses:
        "200":
          description: Data provenance and planned integrations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Source" } }
components:
  parameters:
    Latitude: { name: latitude, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
    Longitude: { name: longitude, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
  schemas:
    ExperimentalPredictionInput:
      type: object
      additionalProperties: false
      required: [cropCode, acknowledgeWarning]
      properties:
        cropCode: { type: string, enum: [WHE, BRL, MZE, RCD, RCW] }
        acknowledgeWarning: { type: boolean, const: true }
        retry: { type: boolean, default: false }
    ExperimentalModel:
      type: object
      required: [cropCode, name, selected, validationMae, validationR2, meanBaselineMae, medianBaselineMae, validationStatus, rejectionReasons, geographicLimitations, trainedCells, validationCells]
      properties:
        cropCode: { type: string }
        name: { type: string }
        selected: { type: string }
        validationMae: { type: number }
        validationR2: { type: [number, "null"] }
        meanBaselineMae: { type: number }
        medianBaselineMae: { type: number }
        validationStatus: { type: string }
        rejectionReasons: { type: array, items: { type: string } }
        geographicLimitations: { type: string }
        trainedCells: { type: integer }
        validationCells: { type: integer }
    ExperimentalStatus:
      type: object
      required: [authorized, available, warning, models, productionPredictionsEnabled, reason]
      properties:
        authorized: { type: boolean }
        available: { type: boolean }
        warning: { type: string }
        productionPredictionsEnabled: { type: boolean }
        reason: { type: string }
        models: { type: array, items: { $ref: "#/components/schemas/ExperimentalModel" } }
    ExperimentalJob:
      type: object
      required: [jobId, status, cropCode, warning, value, unit, reasons, estimatorExecuted, productionAccepted]
      properties:
        jobId: { type: string }
        status: { type: string, enum: [preparing, experimental_output, missing_inputs, unavailable, interrupted] }
        cropCode: { type: string }
        warning: { type: string }
        value: { type: [number, "null"] }
        unit: { type: string }
        reasons: { type: array, items: { type: string } }
        estimatorExecuted: { type: boolean }
        productionAccepted: { type: boolean }
        target: { type: string }
        modelVersion: { type: string }
        datasetHash: { type: string }
        artifactSha256: { type: string }
        geographicSupport: { type: string }
        supportReasons: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        validation:
          type: object
          additionalProperties: true
        inputSummary:
          type: object
          additionalProperties: true
        requestedCoordinates:
          type: object
          additionalProperties: true
        createdAt: { type: string }
        completedAt: { type: string }
    GaezAssessmentInput:
      type: object
      required: [cropCode, scenario]
      properties:
        cropCode: { type: string, maxLength: 10 }
        scenario: { type: string, maxLength: 10 }
        datasetVersion: { type: string, default: GAEZ-v5, maxLength: 20 }
        referencePeriod: { type: string, default: "2001-2020", maxLength: 20 }
    GaezCode:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    GaezClass:
      type: object
      required: [code, label]
      properties:
        code: { type: integer }
        label: { type: string }
    GaezDataset:
      type: object
      required: [version, variable, referencePeriod, title, resolutionLabel, unit, license, metadataUrl, catalogUrl, classDefinitionUrl, attribution]
      properties:
        version: { type: string }
        variable: { type: string }
        referencePeriod: { type: string }
        title: { type: string }
        resolutionLabel: { type: string }
        unit: { type: string }
        license: { type: string }
        metadataUrl: { type: string }
        catalogUrl: { type: string }
        classDefinitionUrl: { type: string }
        attribution: { type: string }
    GaezCatalog:
      type: object
      required: [status, dataset, warnings, crops, scenarios, classes, cachedLayers]
      properties:
        status: { type: string, enum: [available, unavailable] }
        dataset: { $ref: "#/components/schemas/GaezDataset" }
        warnings: { type: array, items: { type: string } }
        crops: { type: array, items: { $ref: "#/components/schemas/GaezCode" } }
        scenarios: { type: array, items: { $ref: "#/components/schemas/GaezCode" } }
        classes: { type: array, items: { $ref: "#/components/schemas/GaezClass" } }
        cachedLayers: { type: integer }
    GaezAssessment:
      type: object
      required: [status, cropCode, cropName, scenario, scenarioLabel, dataset, datasetId, sourceUrl, sha256, retrievedAt, rawValue, category, sampling, warnings]
      properties:
        status: { type: string, enum: [available, nodata, not_land, outside_coverage, unsupported, unavailable] }
        cropCode: { type: string }
        cropName: { type: string }
        scenario: { type: string }
        scenarioLabel: { type: string }
        dataset: { $ref: "#/components/schemas/GaezDataset" }
        datasetId: { type: [string, "null"] }
        sourceUrl: { type: [string, "null"] }
        sha256: { type: [string, "null"] }
        retrievedAt: { type: [string, "null"] }
        rawValue: { type: [integer, "null"] }
        category: { type: [string, "null"] }
        sampling: { $ref: "#/components/schemas/JsonRecord" }
        warnings: { type: array, items: { type: string } }
    GaezReportEvidence:
      type: object
      required: [status, dataset, generatedAt, results, warnings, planningNotes, context]
      properties:
        status: { type: string, enum: [available, partial, unavailable] }
        dataset: { $ref: "#/components/schemas/GaezDataset" }
        generatedAt: { type: string }
        results: { type: array, items: { $ref: "#/components/schemas/GaezAssessment" } }
        warnings: { type: array, items: { type: string } }
        planningNotes: { type: array, items: { type: string } }
        context: { $ref: "#/components/schemas/JsonRecord" }
    AnalysisModelStatus:
      type: object
      required: [adapterVersion, stage, state, predictionsEnabled, message, reasons, contract, target]
      properties:
        adapterVersion: { type: string }
        stage: { type: string, enum: [stage_a] }
        state: { type: string, enum: [not_installed, incompatible, insufficiently_validated, validated_ready, temporarily_unavailable] }
        predictionsEnabled: { type: boolean }
        message: { type: string }
        reasons: { type: array, items: { type: string } }
        contract: { $ref: "#/components/schemas/JsonRecord" }
        target: { $ref: "#/components/schemas/JsonRecord" }
    CropCoverageDiagnostic:
      type: object
      required: [crop, modelCrop, status, available, reasons]
      properties:
        crop: { type: string }
        modelCrop: { type: ["string", "null"] }
        status: { type: string, enum: [insufficient_evidence] }
        available: { type: boolean }
        reasons: { type: array, items: { type: string } }
    AnalysisIntegration:
      type: object
      required: [adapterVersion, stage, generatedAt, model, featurePreparation, coverage, plannerUse, warnings]
      properties:
        adapterVersion: { type: string }
        stage: { type: string, enum: [stage_a] }
        generatedAt: { type: string }
        model: { $ref: "#/components/schemas/AnalysisModelStatus" }
        featurePreparation: { $ref: "#/components/schemas/JsonRecord" }
        coverage: { type: array, items: { $ref: "#/components/schemas/CropCoverageDiagnostic" } }
        plannerUse: { type: string }
        warnings: { type: array, items: { type: string } }
    FarmingPlanInput:
      type: object
      properties:
        plantingDate: { type: ["string", "null"], format: date }
        priority: { type: ["string", "null"], enum: [conserve_water, soil_health, productivity, reduce_risk, null] }
        currentRotation: { type: array, maxItems: 6, items: { type: string, maxLength: 100 } }
        previousCrops: { type: array, maxItems: 12, items: { type: string, maxLength: 100 } }
        excludedCrops: { type: array, maxItems: 20, items: { type: string, maxLength: 100 } }
        operationalLimitations: { type: string, maxLength: 2000 }
        availableSeasonalWaterMm: { type: ["number", "null"], minimum: 0, maximum: 10000 }
    AgriculturalReference:
      type: object
      required: [id, title, url, scope, checkedOn]
      properties:
        id: { type: string }
        title: { type: string }
        url: { type: string }
        scope: { type: string }
        checkedOn: { type: string }
    ReferenceCrop:
      type: object
      required: [id, name, group, season, growingDays, sourceIds, limitations, ecologicalRequirements]
      properties:
        id: { type: string }
        name: { type: string }
        group: { type: string }
        season: { type: string }
        growingDays: { type: array, items: { type: integer } }
        waterMm: { type: array, items: { type: number } }
        sourceIds: { type: array, items: { type: string } }
        limitations: { type: array, items: { type: string } }
        ecologicalRequirements: { $ref: "#/components/schemas/JsonRecord" }
    AgriculturalKnowledge:
      type: object
      required: [version, crops, references, limitations]
      properties:
        version: { type: string }
        crops: { type: array, items: { $ref: "#/components/schemas/ReferenceCrop" } }
        references: { type: array, items: { $ref: "#/components/schemas/AgriculturalReference" } }
        limitations: { type: array, items: { type: string } }
        dataset: { $ref: "#/components/schemas/JsonRecord" }
    PlanningFinding:
      type: object
      required: [code, message, sourceIds]
      properties:
        code: { type: string }
        message: { type: string }
        sourceIds: { type: array, items: { type: string } }
    PlanningCandidate:
      type: object
      required: [crop, status, reasons, risks, calendar, environmentalContext]
      properties:
        crop: { $ref: "#/components/schemas/ReferenceCrop" }
        status: { type: string }
        reasons: { type: array, items: { $ref: "#/components/schemas/PlanningFinding" } }
        risks: { type: array, items: { $ref: "#/components/schemas/PlanningFinding" } }
        calendar: { $ref: "#/components/schemas/JsonRecord" }
        environmentalContext: { $ref: "#/components/schemas/JsonRecord" }
        screen: { $ref: "#/components/schemas/JsonRecord" }
    RotationScenario:
      type: object
      required: [slot, title, crops, status, benefits, risks, waterRequirementMm, schedule]
      properties:
        slot: { type: string }
        title: { type: string }
        strategyType: { type: string }
        crops: { type: array, items: { type: string } }
        status: { type: string }
        benefits: { type: array, items: { $ref: "#/components/schemas/PlanningFinding" } }
        risks: { type: array, items: { $ref: "#/components/schemas/PlanningFinding" } }
        waterRequirementMm: { type: ["array", "null"], items: { type: number } }
        schedule: { type: array, items: { $ref: "#/components/schemas/JsonRecord" } }
    FarmingPlanReport:
      type: object
      required: [id, farmId, createdAt, knowledgeVersion, engineVersion, status, modelStatus, inputs, candidates, scenarios, management, missingInformation, warnings, references, environmentalEvidence]
      properties:
        gaezEvidence: { $ref: "#/components/schemas/GaezReportEvidence" }
        id: { type: integer }
        farmId: { type: integer }
        createdAt: { type: string }
        knowledgeVersion: { type: string }
        engineVersion: { type: string }
        status: { type: string }
        modelStatus: { type: string }
        priorityApplied: { type: string }
        inputs: { $ref: "#/components/schemas/JsonRecord" }
        candidates: { type: array, items: { $ref: "#/components/schemas/PlanningCandidate" } }
        scenarios: { type: array, items: { $ref: "#/components/schemas/RotationScenario" } }
        management: { type: array, items: { $ref: "#/components/schemas/PlanningFinding" } }
        missingInformation: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        references: { type: array, items: { $ref: "#/components/schemas/AgriculturalReference" } }
        environmentalEvidence: { $ref: "#/components/schemas/JsonRecord" }
        aiIntegration: { $ref: "#/components/schemas/AnalysisIntegration" }
    FarmingPlanSummary:
      type: object
      required: [id, farmId, createdAt, status, knowledgeVersion]
      properties:
        id: { type: integer }
        farmId: { type: integer }
        createdAt: { type: string }
        status: { type: string }
        knowledgeVersion: { type: string }
    JsonRecord:
      type: object
      additionalProperties: true
    EnvironmentLocation:
      type: object
      required: [key, name, latitude, longitude, matchingPolicy]
      properties:
        key: { type: string }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        studyId: { type: [string, "null"] }
        matchingPolicy: { type: string }
    ClimateAggregate:
      type: object
      required: [period, expectedDays, validDays, T2M, T2M_MAX, T2M_MIN, PRECTOTCORR, RH2M, GWETTOP, GWETROOT, hotDays, hotDays30, hotDays35, maximumTemperature, minimumTemperature]
      properties:
        period: { type: string }
        expectedDays: { type: integer }
        validDays: { type: object, additionalProperties: { type: integer } }
        T2M: { type: [number, "null"] }
        T2M_MAX: { type: [number, "null"] }
        T2M_MIN: { type: [number, "null"] }
        PRECTOTCORR: { type: [number, "null"] }
        RH2M: { type: [number, "null"] }
        GWETTOP: { type: [number, "null"] }
        GWETROOT: { type: [number, "null"] }
        hotDays: { type: [integer, "null"] }
        hotDays30: { type: [integer, "null"] }
        hotDays35: { type: [integer, "null"] }
        maximumTemperature: { type: [number, "null"] }
        minimumTemperature: { type: [number, "null"] }
        longestDrySpell: { type: [integer, "null"] }
        PRECTOTCORRAnomaly: { type: [number, "null"] }
        PRECTOTCORRReferenceYears: { type: integer }
        GWETTOPAnomaly: { type: [number, "null"] }
        GWETROOTAnomaly: { type: [number, "null"] }
        GWETTOPReferenceYears: { type: integer }
        GWETROOTReferenceYears: { type: integer }
    EnvironmentProvenance:
      type: object
      required: [parameter, unit, source, product, classification, sourceUrl, retrievedAt, metadata]
      properties:
        parameter: { type: string }
        unit: { type: string }
        source: { type: string }
        product: { type: string }
        classification: { type: string }
        sourceUrl: { type: string }
        retrievedAt: { type: string }
        metadata: { $ref: "#/components/schemas/JsonRecord" }
    EnvironmentalSummary:
      type: object
      required: [location, status, monthly, annual, seasonal, hotThreshold, dryThreshold, referencePeriod, warnings, provenance, availableParameters, drySpellDefinition]
      properties:
        retrieval: { $ref: "#/components/schemas/JsonRecord" }
        location: { $ref: "#/components/schemas/EnvironmentLocation" }
        status: { type: string }
        monthly: { type: array, items: { $ref: "#/components/schemas/ClimateAggregate" } }
        annual: { type: array, items: { $ref: "#/components/schemas/ClimateAggregate" } }
        seasonal: { type: array, items: { $ref: "#/components/schemas/ClimateAggregate" } }
        hotThreshold: { type: number }
        dryThreshold: { type: number }
        referencePeriod: { type: string }
        warnings: { type: array, items: { type: string } }
        provenance: { type: array, items: { $ref: "#/components/schemas/EnvironmentProvenance" } }
        availableParameters: { type: array, items: { type: string } }
        drySpellDefinition: { type: string }
    DailyEnvironment:
      type: object
      required: [date, T2M, T2M_MAX, T2M_MIN, PRECTOTCORR, RH2M, GWETTOP, GWETROOT]
      properties:
        date: { type: string }
        T2M: { type: [number, "null"] }
        T2M_MAX: { type: [number, "null"] }
        T2M_MIN: { type: [number, "null"] }
        PRECTOTCORR: { type: [number, "null"] }
        RH2M: { type: [number, "null"] }
        GWETTOP: { type: [number, "null"] }
        GWETROOT: { type: [number, "null"] }
    EnvironmentalHistory:
      type: object
      required: [location, year, daily, units, warning]
      properties:
        location: { $ref: "#/components/schemas/EnvironmentLocation" }
        year: { type: integer }
        daily: { type: array, items: { $ref: "#/components/schemas/DailyEnvironment" } }
        units: { type: object, additionalProperties: { type: string } }
        warning: { type: string }
    SoilValue:
      type: object
      required: [value, unit, quality]
      properties:
        value: { type: [number, "null"] }
        unit: { type: string }
        quality: { type: string }
    SoilEstimate:
      type: object
      required: [originalLatitude, originalLongitude, sampleLatitude, sampleLongitude, offsetKm, depthCm, classification, properties, provenance, retrievedAt]
      properties:
        originalLatitude: { type: number }
        originalLongitude: { type: number }
        sampleLatitude: { type: number }
        sampleLongitude: { type: number }
        offsetKm: { type: number }
        depthCm: { type: string }
        classification: { type: string }
        properties: { type: object, additionalProperties: { $ref: "#/components/schemas/SoilValue" } }
        provenance: { $ref: "#/components/schemas/JsonRecord" }
        retrievedAt: { type: string }
    SoilProperties:
      type: object
      required: [status, notice, warnings]
      properties:
        status: { type: string }
        notice: { type: string }
        warnings: { type: array, items: { type: string } }
        estimate:
          anyOf:
            - { $ref: "#/components/schemas/SoilEstimate" }
            - { type: "null" }
    WetnessHistory:
      type: object
      required: [location, monthly, seasonal, classification, unit, warnings]
      properties:
        location: { $ref: "#/components/schemas/EnvironmentLocation" }
        monthly: { type: array, items: { $ref: "#/components/schemas/ClimateAggregate" } }
        seasonal: { type: array, items: { $ref: "#/components/schemas/ClimateAggregate" } }
        classification: { type: string }
        unit: { type: string }
        warnings: { type: array, items: { type: string } }
    RegionalComparison:
      type: object
      required: [studyId, name, latitude, longitude]
      properties:
        studyId: { type: string }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        summary:
          anyOf:
            - { $ref: "#/components/schemas/EnvironmentalSummary" }
            - { type: "null" }
    IngestionAudit:
      type: object
      required: [id, source, status, startedAt, report]
      properties:
        id: { type: integer }
        source: { type: string }
        status: { type: string }
        startedAt: { type: string }
        completedAt: { type: [string, "null"] }
        report: { $ref: "#/components/schemas/JsonRecord" }
    DataStatus:
      type: object
      required: [environmentalValues, soilEstimates, importPolicy, reports]
      properties:
        environmentalValues: { type: integer }
        soilEstimates: { type: integer }
        importPolicy: { type: string }
        reports: { type: array, items: { $ref: "#/components/schemas/IngestionAudit" } }
    MeasurementInput:
      type: object
      required: [parameter, value, unit, measuredOn, source]
      properties:
        parameter: { type: string, enum: [clay_pct, sand_pct, silt_pct, ph, soc_g_kg, soil_moisture] }
        value: { type: number }
        unit: { type: string, enum: ["%", pH, g/kg, m3/m3, g/100g] }
        depthTopCm: { type: [number, "null"] }
        depthBottomCm: { type: [number, "null"] }
        measuredOn: { type: string }
        source: { type: string, enum: [farmer_reported, laboratory_confirmed] }
        notes: { type: string }
    FarmerMeasurement:
      allOf:
        - { $ref: "#/components/schemas/MeasurementInput" }
        - type: object
          required: [id, farmId, createdAt, verification]
          properties:
            id: { type: integer }
            farmId: { type: integer }
            createdAt: { type: string }
            verification: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Polygon:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Polygon] }
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items: { type: number }
    FarmInput:
      type: object
      required: [name, locationName, latitude, longitude, currentCrop, irrigation, goal]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        locationName: { type: string, minLength: 1, maxLength: 300 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        boundary: { $ref: "#/components/schemas/Polygon" }
        currentCrop: { type: string, minLength: 1, maxLength: 100 }
        cropHistory: { type: string, maxLength: 1000 }
        irrigation: { type: string, enum: [rainfed, limited, fully_irrigated] }
        soilType: { type: string, maxLength: 100 }
        soilMoisture: { type: ["number", "null"], minimum: 0, maximum: 100 }
        soilPh: { type: ["number", "null"], minimum: 0, maximum: 14 }
        farmSize: { type: ["number", "null"], exclusiveMinimum: 0 }
        waterConstraints: { type: string, maxLength: 1000 }
        waterResources: { type: string, maxLength: 1000 }
        agriculturalConstraints: { type: string, maxLength: 1000 }
        goal: { type: string, enum: [conserve_water, soil_health, productivity, reduce_risk] }
    Farm:
      allOf:
        - { $ref: "#/components/schemas/FarmInput" }
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: integer }
            createdAt: { type: string }
            updatedAt: { type: string }
    CaseStudy:
      type: object
      required: [name, latitude, longitude, country, description]
      properties:
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        country: { type: string }
        description: { type: string }
    MonthlyObservation:
      type: object
      required: [month, rainfall, temperature]
      properties:
        month: { type: string }
        rainfall: { type: ["number", "null"] }
        temperature: { type: ["number", "null"] }
    Environment:
      type: object
      required: [status, source, sourceUrl, dateRange, monthly, warnings, heatDays, soilMoisture, vegetationIndex, fetchedAt]
      properties:
        status: { type: string, enum: [available, partial, unavailable] }
        source: { type: string }
        sourceUrl: { type: string }
        dateRange: { type: string }
        monthly: { type: array, items: { $ref: "#/components/schemas/MonthlyObservation" } }
        warnings: { type: array, items: { type: string } }
        heatDays: { type: ["integer", "null"] }
        soilMoisture: { type: ["number", "null"] }
        vegetationIndex: { type: ["number", "null"] }
        fetchedAt: { type: ["string", "null"] }
    StrategyInput:
      type: object
      required: [slot, name, crops, notes]
      properties:
        slot: { type: string, enum: [alternative_a, alternative_b] }
        name: { type: string, minLength: 1, maxLength: 120 }
        crops: { type: array, minItems: 1, maxItems: 6, items: { type: string, minLength: 1, maxLength: 100 } }
        notes: { type: string, maxLength: 2000 }
    Strategy:
      allOf:
        - { $ref: "#/components/schemas/StrategyInput" }
        - type: object
          required: [id, farmId, status]
          properties:
            id: { type: integer }
            farmId: { type: integer }
            status: { type: string }
    Source:
      type: object
      required: [id, name, url, status, description]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        status: { type: string }
        description: { type: string }
