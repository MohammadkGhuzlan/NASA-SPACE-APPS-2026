openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Field Shift farm intelligence foundation
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /farms:
    get:
      operationId: listFarms
      responses:
        "200":
          description: Saved farms
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Farm" } }
    post:
      operationId: createFarm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FarmInput" }
      responses:
        "201":
          description: Saved farm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
  /farms/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getFarm
      responses:
        "200":
          description: Farm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
    put:
      operationId: updateFarm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FarmInput" }
      responses:
        "200":
          description: Updated farm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
  /case-studies:
    get:
      operationId: listCaseStudies
      responses:
        "200":
          description: Geographic starting points, not measured farms
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CaseStudy" } }
  /geocode:
    get:
      operationId: searchLocations
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        "200":
          description: Global search results
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CaseStudy" } }
  /farms/{id}/environment:
    get:
      operationId: getEnvironment
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Available measurements and explicit limitations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
  /farms/{id}/strategies:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listStrategies
      responses:
        "200":
          description: Farmer draft strategies
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Strategy" } }
    post:
      operationId: saveStrategy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StrategyInput" }
      responses:
        "201":
          description: Saved unassessed strategy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Strategy" }
  /sources:
    get:
      operationId: listSources
      responses:
        "200":
          description: Data provenance and planned integrations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Source" } }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Polygon:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Polygon] }
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items: { type: number }
    FarmInput:
      type: object
      required: [name, locationName, latitude, longitude, currentCrop, irrigation, goal]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        locationName: { type: string, minLength: 1, maxLength: 300 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        boundary: { $ref: "#/components/schemas/Polygon" }
        currentCrop: { type: string, minLength: 1, maxLength: 100 }
        cropHistory: { type: string, maxLength: 1000 }
        irrigation: { type: string, enum: [rainfed, limited, fully_irrigated] }
        soilType: { type: string, maxLength: 100 }
        soilMoisture: { type: ["number", "null"], minimum: 0, maximum: 100 }
        soilPh: { type: ["number", "null"], minimum: 0, maximum: 14 }
        farmSize: { type: ["number", "null"], exclusiveMinimum: 0 }
        waterConstraints: { type: string, maxLength: 1000 }
        goal: { type: string, enum: [conserve_water, soil_health, productivity, reduce_risk] }
    Farm:
      allOf:
        - { $ref: "#/components/schemas/FarmInput" }
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: integer }
            createdAt: { type: string }
            updatedAt: { type: string }
    CaseStudy:
      type: object
      required: [name, latitude, longitude, country, description]
      properties:
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        country: { type: string }
        description: { type: string }
    MonthlyObservation:
      type: object
      required: [month, rainfall, temperature]
      properties:
        month: { type: string }
        rainfall: { type: ["number", "null"] }
        temperature: { type: ["number", "null"] }
    Environment:
      type: object
      required: [status, source, sourceUrl, dateRange, monthly, warnings, heatDays, soilMoisture, vegetationIndex, fetchedAt]
      properties:
        status: { type: string, enum: [available, partial, unavailable] }
        source: { type: string }
        sourceUrl: { type: string }
        dateRange: { type: string }
        monthly: { type: array, items: { $ref: "#/components/schemas/MonthlyObservation" } }
        warnings: { type: array, items: { type: string } }
        heatDays: { type: ["integer", "null"] }
        soilMoisture: { type: ["number", "null"] }
        vegetationIndex: { type: ["number", "null"] }
        fetchedAt: { type: ["string", "null"] }
    StrategyInput:
      type: object
      required: [slot, name, crops, notes]
      properties:
        slot: { type: string, enum: [alternative_a, alternative_b] }
        name: { type: string, minLength: 1, maxLength: 120 }
        crops: { type: array, minItems: 1, maxItems: 6, items: { type: string, minLength: 1, maxLength: 100 } }
        notes: { type: string, maxLength: 2000 }
    Strategy:
      allOf:
        - { $ref: "#/components/schemas/StrategyInput" }
        - type: object
          required: [id, farmId, status]
          properties:
            id: { type: integer }
            farmId: { type: integer }
            status: { type: string }
    Source:
      type: object
      required: [id, name, url, status, description]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        status: { type: string }
        description: { type: string }
